name: Deploy Puzzle Lab to GitHub Pages

# Publishes the static Puzzle Lab site (repo root) to GitHub Pages.
# The game is plain HTML/CSS/JS with a .nojekyll file, so there is no build
# step — we just upload the root and deploy it.

on:
  push:
    branches: [claude/terraria-github-page-routing-od7rdz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site (static, no build step)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
